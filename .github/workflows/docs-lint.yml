name: docs-lint

# Enforces the docs vault structural invariants (scripts/lint_docs.py).
# See CLAUDE.md "Authoring rules" and docs/meta/knowledge-base.md.
#
# Runs on every PR, code-only ones included: a leaf's `Code:` line links a
# directory of this repo, so moving or renaming code can break the tree.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Unit tests for the linter
        run: make test-lint
      - name: Lint the docs vault
        run: make lint-docs
